name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支连推时取消旧跑，省 CI 分钟。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint 需要拉全历史比对 PR 提交区间。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Commitlint (PR 提交区间)
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}
      # 测试经 ELECTRON_RUN_AS_NODE 跑在 Electron 运行时上；先验证 SQLite 原生绑定能被 Electron 加载。
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: Audit app dependencies
        run: npm audit --audit-level=high
        working-directory: app
      - name: lint
        run: npm run lint
        working-directory: app
      - name: typecheck
        run: npm run typecheck
        working-directory: app
      - name: test
        # Electron-as-node 在此 runner 上会让 vite-node 的 fork 临时缓存整片 ENOENT（PR #29，
        # 零断言失败也 exit 1）；单测跑纯 Node——better-sqlite3 是 N-API prebuild 运行时无关，
        # Electron 运行时由本 job 的 native:check 与 windows e2e job 双重覆盖。
        run: npm run test
        env:
          STAFFDESK_VITEST_RUNTIME: node
        working-directory: app
      - name: build
        run: npm run build
        working-directory: app

  # renderer 层没有行为单测，e2e 是唯一的 UI 级回归网——必须进门禁。
  # 跑在 windows 上：与交付平台一致（NSIS / 开发机环境），无需 xvfb。
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
      - name: e2e
        run: npm run e2e
        working-directory: app

  # main/tag 上做安装包冒烟：抓住 NSIS 配置漂移与 win 专属打包问题。
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Package Windows installer
        run: npm run package
        working-directory: app
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: staffdesk-win-installer
          path: app/dist/*.exe
          retention-days: 7
          if-no-files-found: error
      # F1（审计 2026-09-02）：交付链路从「能打包」变「装得上、起得来」——
      # NSIS oneClick per-user 静默装 /S 到 %LOCALAPPDATA%\Programs\StaffDesk，再启动断言进程存活。
      # StaffDesk 是托盘常驻应用（close 只收进托盘不退进程），验证完必须强制收尾，否则 job 挂到超时。
      - name: Silent install + launch smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path app/dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer exe found under app/dist" }
          Write-Host "Silent-installing $($installer.FullName)"
          $installProc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installProc.ExitCode -ne 0) { throw "installer exited with code $($installProc.ExitCode)" }
          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\StaffDesk\StaffDesk.exe'
          if (-not (Test-Path $installedExe)) { throw "installed exe not found: $installedExe" }
          Write-Host "Launching installed app"
          Start-Process -FilePath $installedExe
          Start-Sleep -Seconds 15
          $running = Get-Process -Name StaffDesk -ErrorAction SilentlyContinue
          if (-not $running) { throw "StaffDesk process is not running after launch" }
          # F1（Spec 评审 M33）：「起得来」还要断言「大脑建得出来」——首启在 userData 创建 brain.db。
          if (-not (Test-Path (Join-Path $env:APPDATA 'StaffDesk\brain.db'))) {
            throw "installed app did not create brain.db under APPDATA"
          }
          Write-Host "Install + launch + brain.db verified; cleaning up"
          Stop-Process -Name StaffDesk -Force -ErrorAction SilentlyContinue
          Wait-Process -Name StaffDesk -Timeout 30 -ErrorAction SilentlyContinue
