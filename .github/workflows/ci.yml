name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支连推时取消旧跑，省 CI 分钟。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint 需要拉全历史比对 PR 提交区间。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Commitlint (PR 提交区间)
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}
      # 测试经 ELECTRON_RUN_AS_NODE 跑在 Electron 运行时上；先验证 SQLite 原生绑定能被 Electron 加载。
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: Audit app dependencies
        run: npm audit --audit-level=high
        working-directory: app
      - name: lint
        run: npm run lint
        working-directory: app
      - name: typecheck
        run: npm run typecheck
        working-directory: app
      - name: test
        run: npm run test
        working-directory: app
      - name: build
        run: npm run build
        working-directory: app

  # renderer 层没有行为单测，e2e 是唯一的 UI 级回归网——必须进门禁。
  # 跑在 windows 上：与交付平台一致（NSIS / 开发机环境），无需 xvfb。
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
      - name: e2e
        run: npm run e2e
        working-directory: app

  # main/tag 上做安装包冒烟：抓住 NSIS 配置漂移与 win 专属打包问题。
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Package Windows installer
        run: npm run package
        working-directory: app
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: staffdesk-win-installer
          path: app/dist/*.exe
          retention-days: 7
          if-no-files-found: error
