name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install app
        run: npm ci
        working-directory: app
      # 测试经 ELECTRON_RUN_AS_NODE 跑在 Electron 运行时上（ABI 与 better-sqlite3 必须一致），
      # npm ci 只带 Node ABI 的 prebuilt，CI 上必须 electron-rebuild（ubuntu 自带编译工具链）。
      - name: Rebuild better-sqlite3 for Electron ABI
        run: npm run rebuild
        working-directory: app
      - name: lint
        run: npm run lint
        working-directory: app
      - name: typecheck
        run: npm run typecheck
        working-directory: app
      - name: test
        run: npm run test
        working-directory: app
      - name: build
        run: npm run build
        working-directory: app
