name: ci

on:
  push:
    branches: ['**']
    # branches 过滤会排除 tag 推送——须显式加 tags，否则 package job 的
    # tag 条件永远等不到触发（v0.2.0 首推验证时发现，Release 步骤从未跑到）。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支连推时取消旧跑，省 CI 分钟。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint 需要拉全历史比对 PR 提交区间。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Commitlint (PR 提交区间)
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}
      # 测试经 ELECTRON_RUN_AS_NODE 跑在 Electron 运行时上；先验证 SQLite 原生绑定能被 Electron 加载。
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: Audit app dependencies
        run: npm audit --audit-level=high
        working-directory: app
      - name: lint
        run: npm run lint
        working-directory: app
      - name: typecheck
        run: npm run typecheck
        working-directory: app
      - name: test
        # Electron-as-node 在此 runner 上会让 vite-node 的 fork 临时缓存整片 ENOENT（PR #29，
        # 零断言失败也 exit 1）；单测跑纯 Node——better-sqlite3 是 N-API prebuild 运行时无关，
        # Electron 运行时由本 job 的 native:check 与 windows e2e job 双重覆盖。
        run: npm run test
        env:
          STAFFDESK_VITEST_RUNTIME: node
        working-directory: app
      - name: build
        run: npm run build
        working-directory: app

  # renderer 层没有行为单测，e2e 是唯一的 UI 级回归网——必须进门禁。
  # 跑在 windows 上：与交付平台一致（NSIS / 开发机环境），无需 xvfb。
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
      - name: e2e
        run: npm run e2e
        working-directory: app

  # main/tag 上做安装包冒烟：抓住 NSIS 配置漂移与 win 专属打包问题。
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    # G2：tag 推送时用 GITHUB_TOKEN 创建 Release（默认 token 无写权，须显式授予）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Package Windows installer
        run: npm run package
        working-directory: app
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: staffdesk-win-installer
          path: app/dist/*.exe
          retention-days: 7
          if-no-files-found: error
      # F1（审计 2026-09-02）：交付链路从「能打包」变「装得上、起得来」——
      # NSIS oneClick /S 静默装后启动断言进程存活。首跑实测落点与 per-user 假设不符
      # （PR #29 合并后 main 首跑红）：改为多候选路径 + 兜底扫描 + 失败时列目录，以探测为准。
      # StaffDesk 是托盘常驻应用（close 只收进托盘不退进程），验证完必须强制收尾，否则 job 挂到超时。
      - name: Silent install + launch smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path app/dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer exe found under app/dist" }
          Write-Host "Silent-installing $($installer.FullName)"
          $installProc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installProc.ExitCode -ne 0) { throw "installer exited with code $($installProc.ExitCode)" }
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            'C:\Program Files',
            'C:\Program Files (x86)'
          )
          $installedExe = Get-ChildItem -Path $roots -Filter 'StaffDesk.exe' -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installedExe) {
            Write-Host "StaffDesk.exe not found under any root; listing roots for diagnosis:"
            foreach ($root in $roots) {
              Write-Host "--- $root"
              Get-ChildItem -Path $root -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Host $_.Name }
            }
            throw "installed StaffDesk.exe not found under $($roots -join ', ')"
          }
          Write-Host "Launching installed app at $installedExe"
          Start-Process -FilePath $installedExe
          Start-Sleep -Seconds 15
          $running = Get-Process -Name StaffDesk -ErrorAction SilentlyContinue
          if (-not $running) { throw "StaffDesk process is not running after launch" }
          # F1（Spec 评审 M33 + #31 合并首跑诊断）：「起得来」还要断言「大脑建得出来」。
          # userData 真实落点是 %APPDATA%\staffdesk-app（Electron 取 package name，与
          # productName 错位——产品侧改名会迁移用户数据，暂不动，双候选探测）。
          $brainPaths = @(
            (Join-Path $env:APPDATA 'staffdesk-app\brain.db'),
            (Join-Path $env:APPDATA 'StaffDesk\brain.db')
          )
          if (-not ($brainPaths | Where-Object { Test-Path $_ })) {
            throw "installed app did not create brain.db under APPDATA (probed: $($brainPaths -join ', '))"
          }
          Write-Host "Install + launch + brain.db verified; cleaning up"
          Stop-Process -Name StaffDesk -Force -ErrorAction SilentlyContinue
          Wait-Process -Name StaffDesk -Timeout 30 -ErrorAction SilentlyContinue
      # G2（审计五轮）：安装包 7 天 artifact 会消失——tag 推送时把通过装机终验的安装包
      # 发布成 GitHub Release，交付物持久可下载（README 挂 Releases 链接）。
      - name: Publish release on tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF##*/}" app/dist/*.exe \
            --title "StaffDesk ${GITHUB_REF##*/}" \
            --generate-notes
