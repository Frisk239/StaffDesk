name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install app
        run: npm ci
        working-directory: app
      # 测试经 ELECTRON_RUN_AS_NODE 跑在 Electron 运行时上；先验证 SQLite 原生绑定能被 Electron 加载。
      - name: Verify native SQLite binding
        run: npm run native:check
        working-directory: app
      - name: lint
        run: npm run lint
        working-directory: app
      - name: typecheck
        run: npm run typecheck
        working-directory: app
      - name: test
        run: npm run test
        working-directory: app
      - name: build
        run: npm run build
        working-directory: app
